name: Dud
options:
  bundleIdPrefix: com.elior
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    TARGETED_DEVICE_FAMILY: "1"

packages:
  SwitcherKit:
    path: Packages/SwitcherKit

targets:
  Dud:
    type: application
    platform: iOS
    scheme:
      gatherCoverageData: false
    sources:
      - App
      - Shared
      - path: Resources/Assets.xcassets
    dependencies:
      - package: SwitcherKit
      - target: DudWidget
        embed: true
    entitlements:
      path: Resources/Dud.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.elior.dud
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: דוד
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations: [he]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: האפליקציה מדברת עם הדוד ישירות ברשת ה-WiFi של הבית.
        NSSupportsLiveActivities: true
        LSApplicationQueriesSchemes: [switcher, switchersmart]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elior.dud
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: דוד

  DudWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: SwitcherKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Resources/DudWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.elior.dud
    info:
      path: Resources/Widget-Info.plist
      properties:
        CFBundleDisplayName: דוד
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elior.dud.widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
