name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test the Switcher protocol
        run: |
          set -o pipefail
          swift test --package-path Packages/SwitcherKit 2>&1 | tee test.log
        # errors are reported as annotations so they can be read without the raw log

      - name: Install tools
        run: brew install xcodegen ldid 2>&1 | tee brew.log

      - name: Generate Xcode project
        run: xcodegen generate 2>&1 | tee gen.log

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Ember.xcodeproj -scheme Dud -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Embed entitlements and package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Dud.app
          # Sideloadly re-signs the app; the entitlements (app group) must already be inside
          ldid -SResources/DudWidget.entitlements "$APP/PlugIns/DudWidget.appex/DudWidget"
          ldid -SResources/Dud.entitlements "$APP/Dud"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Ember.ipa Payload
          ls -lh Ember.ipa

      - name: Report errors
        if: failure()
        run: |
          for f in test.log brew.log gen.log build.log; do
            [ -f "$f" ] || continue
            grep -E "error[:]|Error[:]|failed|FAIL" "$f" | sed 's/^ *//' | sort -u | head -40 | while IFS= read -r line; do
              echo "::error title=$f::${line:0:900}"
            done
            tail -5 "$f" | while IFS= read -r line; do echo "::warning title=$f tail::${line:0:900}"; done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Ember-ipa
          path: Ember.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Ember.ipa \
            --title "Ember - בנייה ${{ github.run_number }}" \
            --notes "קובץ IPA להתקנה עם Sideloadly." --latest
