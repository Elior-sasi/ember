name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test the Switcher protocol
        run: swift test --package-path Packages/SwitcherKit

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Dud.xcodeproj -scheme Dud -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60

      - name: Embed entitlements and package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Dud.app
          # Sideloadly re-signs the app; the entitlements (app group) must already be inside
          ldid -SResources/DudWidget.entitlements "$APP/PlugIns/DudWidget.appex/DudWidget"
          ldid -SResources/Dud.entitlements "$APP/Dud"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Dud.ipa Payload
          ls -lh Dud.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Dud-ipa
          path: Dud.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Dud.ipa \
            --title "דוד - בנייה ${{ github.run_number }}" \
            --notes "קובץ IPA להתקנה עם Sideloadly." --latest
